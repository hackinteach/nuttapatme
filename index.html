    <!--
      Consent Mode v2 + GTM. No third-party CMP — the React banner
      (src/components/CookieBanner.tsx) calls window.gtag('consent','update')
      directly and stores the choice in localStorage.
      Production-domain gate prevents firing on dev/preview environments.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){window.dataLayer.push(arguments);}
      window.gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500
      });
      window.gtag('set', 'ads_data_redaction', true);
      window.gtag('set', 'url_passthrough', true);
    </script>
    <script>
      // Defer GTM until after `load` so it doesn't block LCP on slow CPUs.
      // PSI mobile (Moto G Power, 4G) showed GTM eating ~1.8s of script
      // time during initial render. Pushing it to idle keeps the conversion
      // tracking working (clicks happen well after load) while letting the
      // hero paint first.
      (function(){
        var host = location.hostname;
        if (host !== 'nuttapatk.dev' && host !== 'www.nuttapatk.dev') return;

        function loadGTM(){
          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-5T2973JX');
        }

        if (document.readyState === 'complete') {
          setTimeout(loadGTM, 1500);
        } else {
          window.addEventListener('load', function(){ setTimeout(loadGTM, 1500); }, { once: true });
        }
      })();
    </script>
