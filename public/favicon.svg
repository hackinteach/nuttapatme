<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" width="34" height="34">
  <defs>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1e"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
  </defs>

  <!-- Gradient border ring -->
  <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#nGrad)"/>
  <!-- Dark inner background -->
  <rect x="2" y="2" width="30" height="30" rx="6.5" fill="url(#bgGrad)"/>
  <!-- Bold N — System UI -->
  <text x="17" y="25" text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-weight="700" font-size="22"
        fill="url(#nGrad)">N</text>
</svg>
